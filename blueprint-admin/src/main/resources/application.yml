server:
  port: 8080

spring:
  application:
    name: blueprint-admin
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/blueprint
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

file:
  upload:
    path: ./uploads
    max-size: 10
    allowed-types: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx,zip
    storage: local
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:admin}
      secret-key: ${MINIO_SECRET_KEY:admin123456}
      bucket: ${MINIO_BUCKET:blueprint}

jwt:
  secret: blueprint-secret-key-2026-enterprise-ai-backend-lzw
  expiration: 86400000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
