server:
  port: 8080

spring:
  application:
    name: blueprint-admin
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/blueprint
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

jwt:
  secret: blueprint-secret-key-2026-enterprise-ai-backend-lzw
  expiration: 86400000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
